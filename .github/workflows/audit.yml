name: Audit validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Rebuild and validate audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --force FETCH_HEAD

      - name: Show Node and npm versions
        run: |
          node --version
          npm --version

      - name: Install dependencies safely
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Rebuild audit outputs
        run: npm run rebuild

      - name: Validate audit outputs
        run: npm run validate

      - name: Regenerate checksums
        run: npm run checksums
